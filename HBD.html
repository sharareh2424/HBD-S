<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎇 آتش‌بازی تولد 🎇</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 10px yellow;
        }
    </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>
<h1 id="message">hello30</h1>

<script>
    const canvas = document.getElementById("fireworksCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Firework {
        constructor(x, y, targetX, targetY) {
            this.x = x;
            this.y = y;
            this.targetX = targetX;
            this.targetY = targetY;
            this.speed = 5;
            this.radius = 3;
            this.exploded = false;
            this.explosionParticles = [];
        }

        update() {
            if (!this.exploded) {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < this.speed) {
                    this.exploded = true;
                    this.createExplosion();
                } else {
                    this.x += (dx / distance) * this.speed;
                    this.y += (dy / distance) * this.speed;
                }
            } else {
                this.explosionParticles.forEach(p => p.update());
            }
        }

        draw() {
            if (!this.exploded) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.fill();
            } else {
                this.explosionParticles.forEach(p => p.draw());
            }
        }

        createExplosion() {
            for (let i = 0; i < 50; i++) {
                this.explosionParticles.push(new Particle(this.x, this.y));
            }
        }
    }

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.speed = Math.random() * 4 + 2;
            this.angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;
            this.alpha = 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.02;
        }

        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${Math.random() * 360}, 100%, 50%)`;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    let fireworks = [];

    function createFirework() {
        let x = Math.random() * canvas.width;
        let targetX = Math.random() * canvas.width;
        let targetY = Math.random() * (canvas.height / 2);
        fireworks.push(new Firework(x, canvas.height, targetX, targetY));
    }

    function animate() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        fireworks.forEach((firework, index) => {
            firework.update();
            firework.draw();
            if (firework.exploded && firework.explosionParticles.every(p => p.alpha <= 0)) {
                fireworks.splice(index, 1);
            }
        });

        requestAnimationFrame(animate);
    }

    setInterval(createFirework, 500);
    animate();

    setTimeout(() => {
        document.getElementById("message").textContent = "HBD 🎉";
    }, 5000);
</script>

</body>
</html>
